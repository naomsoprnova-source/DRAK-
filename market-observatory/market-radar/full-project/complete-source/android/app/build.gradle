plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ans.marketobservatory'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ans.marketobservatory'
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName '1.5.2'
    }

    sourceSets {
        main {
            assets {
                srcDirs = ['../../web']
                include 'index.html', 'app.js', 'app.css', 'engine.js', 'chart.js', 'manifest.webmanifest', 'pwa.css', 'sw.js', 'icons/**'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
