name: Android build
on:
  push:
    paths: ['last-signal/**']
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Validate project
        run: godot --headless --editor --path last-signal --quit
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: LastSignal-source
          path: last-signal/
