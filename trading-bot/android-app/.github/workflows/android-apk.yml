name: Build DRAK Demo Android APK

on:
  push:
    paths:
      - 'trading-bot/android-app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-bot/android-app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js for simulation tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local simulation tests
        run: node --test tests/*.test.js
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRAK-Demo-Android-debug
          path: trading-bot/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
